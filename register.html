<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Leadership Readiness System</title>

    <link rel="stylesheet" href="register.css">

    <link
        href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
        rel="stylesheet">

</head>


<body>


    <div class="wrapper">

        <form id="registerForm">

            <h1>Register</h1>

            <p class="subtitle">
                Create your Leadership Readiness account
            </p>


            <!-- STAFF ID -->

            <div class="input-box">

                <input
                    type="text"
                    id="staff_id"
                    placeholder="Staff ID"
                    required>

                <i class="bx bx-id-card"></i>

            </div>


            <!-- FULL NAME -->

            <div class="input-box">

                <input
                    type="text"
                    id="full_name"
                    placeholder="Full Name"
                    required>

                <i class="bx bx-user"></i>

            </div>


            <!-- EMAIL -->

            <div class="input-box">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required>

                <i class="bx bx-envelope"></i>

            </div>


            <!-- PASSWORD -->

            <div class="input-box">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

                <i class="bx bx-lock"></i>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-box">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

                <i class="bx bx-lock-alt"></i>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="btn"
                id="registerBtn">

                Register

            </button>


            <!-- MESSAGE -->

            <p id="message"></p>


            <!-- LOGIN LINK -->

            <div class="login-link">

                <p>

                    Already have an account?

                    <a href="index.html">
                        Login
                    </a>

                </p>

            </div>


        </form>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- SUPABASE CONFIG -->

    <script src="supabase.js"></script>


    <!-- REGISTER SCRIPT -->

    <script src="register.js"></script>


</body>

</html>
